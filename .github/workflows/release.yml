# Builds the Windows installer and publishes it as a GitHub release.
# Runs when a version tag is pushed:  git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Install the Tauri bundler
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installer
        working-directory: crates/desktop
        run: cargo tauri build

      - name: Build the command line tool
        run: cargo build --release -p zman-cli

      - name: Pack the browser extension
        run: Compress-Archive -Path extension/* -DestinationPath zman-extension.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/zman.exe
            zman-extension.zip
