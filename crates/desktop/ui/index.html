<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu Hora Vale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="Tu Hora Vale">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="7" class="brand-bg"/>
        <circle cx="16" cy="16" r="8.5" fill="none" stroke-width="3" class="brand-track"/>
        <path d="M16 7.5a8.5 8.5 0 1 1-7.36 12.75" fill="none" stroke-width="3" stroke-linecap="round" class="brand-arc"/>
        <circle cx="16" cy="16" r="2.3" class="brand-dot"/>
      </svg>
      <span>Tu Hora Vale</span>
    </div>

    <div class="segmented" role="tablist" id="period-switch">
      <button role="tab" data-period="day" data-i18n="day"></button>
      <button role="tab" data-period="week" data-i18n="week"></button>
    </div>

    <nav class="datenav">
      <button class="icon-btn" id="prev" data-i18n-title="previous">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="title"></h1>
      <button class="icon-btn" id="next" data-i18n-title="next">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="ghost-btn" id="go-today" data-i18n="today" hidden></button>
    </nav>

    <div class="topbar-right">
      <button class="focus-btn" id="focus-btn">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="2.4"/></g></svg>
        <span id="focus-label"></span>
      </button>
      <button class="connect-btn" id="connect-btn">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5 9.5 6.5"/><path d="M7.2 4.6 8.6 3.2a3 3 0 0 1 4.2 4.2L11.4 8.8"/><path d="M8.8 11.4 7.4 12.8a3 3 0 0 1-4.2-4.2L4.6 7.2"/></g></svg>
        <span data-i18n="connect"></span>
      </button>
      <div class="status" id="status"><span class="status-dot"></span><span id="status-text"></span></div>
      <div class="menu-wrap">
        <button class="icon-btn" id="settings-btn" data-i18n-title="settings" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 16 16" width="16" height="16"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4.5h7M12.5 4.5H14M2 11.5h1.5M7 11.5h7"/><circle cx="10.7" cy="4.5" r="1.8"/><circle cx="5.3" cy="11.5" r="1.8"/></g></svg>
        </button>
        <div class="menu" id="settings-menu" hidden>
          <label class="switch-row">
            <span data-i18n="autostart"></span>
            <input type="checkbox" id="autostart"><span class="switch"></span>
          </label>
          <label class="switch-row">
            <span data-i18n="pause"></span>
            <input type="checkbox" id="paused"><span class="switch"></span>
          </label>
          <label class="switch-row select-row">
            <span data-i18n="language"></span>
            <select id="language">
              <option value="auto" data-i18n="languageAuto"></option>
              <option value="en">English</option>
              <option value="es">Español</option>
            </select>
          </label>
          <button class="menu-action" id="export-btn">
            <span data-i18n="exportCsv"></span>
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 2.5v8m0 0L4.8 7.3M8 10.5l3.2-3.2M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="menu-info">
            <div class="menu-label" data-i18n="database"></div>
            <div class="menu-path" id="db-path"></div>
            <div class="menu-label" data-i18n="config"></div>
            <div class="menu-path" id="config-path"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="app">
    <section class="tiles" id="tiles"></section>

    <section class="card" id="chart-card">
      <div class="card-head">
        <h2 id="chart-title"></h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="chart" id="chart"></div>
    </section>

    <section class="card" id="clients-card">
      <div class="card-head">
        <h2 data-i18n="clientsTitle"></h2>
        <button class="ghost-btn" id="clients-edit" data-i18n="clientsEdit"></button>
      </div>
      <div id="clients-body"></div>
    </section>

    <section class="columns">
      <div class="card">
        <div class="card-head"><h2 data-i18n="categories"></h2></div>
        <div class="list" id="categories"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-i18n="apps"></h2></div>
        <div class="list" id="apps"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2 data-i18n="sites"></h2></div>
        <div class="list" id="sites"></div>
      </div>
    </section>
  </main>

  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="2.5" opacity=".35"/><path d="M24 13v11l7 4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2 id="empty-title"></h2>
    <p id="empty-text"></p>
  </div>

  <dialog id="connect-dialog" aria-labelledby="connect-title">
    <div class="dialog-head">
      <div>
        <h2 id="connect-title" data-i18n="connectTitle"></h2>
        <p data-i18n="connectLead"></p>
      </div>
      <button class="icon-btn" id="connect-close" data-i18n-title="close">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <section class="conn">
      <div class="conn-head">
        <div><h3>Claude Desktop</h3><p id="claude-note"></p></div>
        <button class="primary-btn" id="claude-toggle"></button>
      </div>
    </section>

    <section class="conn">
      <div class="conn-head">
        <div><h3>Claude Code</h3><p data-i18n="claudeCodeNote"></p></div>
      </div>
      <div class="copy-row"><code id="claude-code-command"></code><button class="ghost-btn" data-copy="claude-code-command" data-i18n="copy"></button></div>
    </section>

    <section class="conn">
      <div class="conn-head">
        <div><h3 data-i18n="remoteTitle"></h3><p data-i18n="remoteNote"></p></div>
      </div>

      <div id="sync-connect">
        <div class="form-actions">
          <button class="primary-btn" type="button" id="pair-start" data-i18n="pairStart"></button>
        </div>
        <div id="pair-wait" hidden>
          <p class="conn-ok" id="pair-note"></p>
          <p data-i18n="pairHelp"></p>
          <div class="copy-row"><code id="pair-url"></code><button class="ghost-btn" type="button" data-copy="pair-url" data-i18n="copy"></button></div>
          <div class="form-actions"><button class="ghost-btn" type="button" id="pair-cancel" data-i18n="pairCancel"></button></div>
        </div>
        <details class="manual">
          <summary data-i18n="manualSignIn"></summary>
      <form id="sync-form" autocomplete="on">
        <label><span data-i18n="server"></span><input id="sync-server" type="text" value="https://app.tuhoravale.com" placeholder="https://app.tuhoravale.com" required></label>
        <div class="form-pair">
          <label><span data-i18n="email"></span><input id="sync-email" type="email" autocomplete="username" required></label>
          <label><span data-i18n="password"></span><input id="sync-password" type="password" autocomplete="current-password" minlength="8" required></label>
        </div>
        <div class="form-actions">
          <button class="primary-btn" type="submit" data-register="false" data-i18n="signIn"></button>
          <button class="ghost-btn" type="submit" data-register="true" data-i18n="createAccount"></button>
        </div>
      </form>
        </details>
      </div>

      <div id="sync-account" hidden>
        <p class="conn-ok" id="sync-summary"></p>
        <div class="copy-row"><code id="mcp-url"></code><button class="ghost-btn" data-copy="mcp-url" data-i18n="copy"></button></div>
        <ol class="steps">
          <li data-i18n="step1"></li>
          <li data-i18n="step2"></li>
          <li data-i18n="step3"></li>
        </ol>
        <div class="form-actions">
          <button class="ghost-btn" id="sync-now" data-i18n="syncNow"></button>
          <button class="ghost-btn" id="sync-logout" data-i18n="signOut"></button>
        </div>
      </div>
    </section>

    <p class="conn-error" id="connect-error" hidden></p>
  </dialog>

  <dialog id="focus-dialog" aria-labelledby="focus-title">
    <div class="dialog-head">
      <div>
        <h2 id="focus-title" data-i18n="focusTitle"></h2>
        <p data-i18n="focusLead"></p>
      </div>
      <button class="icon-btn" id="focus-close" data-i18n-title="close">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <section class="conn">
      <div id="focus-idle">
        <h3 data-i18n="sessionTitle"></h3>
        <p data-i18n="sessionNote"></p>
        <div class="add-row" id="focus-start">
          <button class="primary-btn" data-minutes="25">25 min</button>
          <button class="primary-btn" data-minutes="50">50 min</button>
          <button class="primary-btn" data-minutes="90">90 min</button>
        </div>
      </div>
      <div id="focus-running" class="focus-running" hidden>
        <div>
          <div class="focus-clock" id="focus-clock"></div>
          <p id="focus-ends"></p>
        </div>
        <button class="ghost-btn" id="focus-stop" data-i18n="endSession"></button>
      </div>
    </section>

    <section class="conn">
      <h3 data-i18n="limitsTitle"></h3>
      <p data-i18n="limitsNote"></p>
      <div class="rule-list" id="limit-list"></div>
      <form class="add-row" id="limit-form">
        <input id="limit-target" class="grow" list="limit-options" placeholder="youtube.com" required>
        <datalist id="limit-options"></datalist>
        <input id="limit-minutes" class="narrow" type="number" min="1" max="1440" value="30" required>
        <span data-i18n="minPerDay"></span>
        <button class="ghost-btn" data-i18n="add"></button>
      </form>
    </section>

    <section class="conn">
      <h3 data-i18n="hoursTitle"></h3>
      <p data-i18n="hoursNote"></p>
      <div class="rule-list" id="schedule-list"></div>
      <form class="add-row" id="schedule-form">
        <div class="days" id="schedule-days"></div>
        <input type="time" id="schedule-start" value="09:00" required>
        <span>–</span>
        <input type="time" id="schedule-end" value="18:00" required>
        <button class="ghost-btn" data-i18n="add"></button>
      </form>
    </section>

    <section class="conn">
      <h3 data-i18n="sitesTitle"></h3>
      <p data-i18n="sitesNote"></p>
      <div class="rule-list chips" id="site-list"></div>
      <form class="add-row" id="site-form">
        <input id="site-input" class="grow" placeholder="example.com" required>
        <button class="ghost-btn" data-i18n="add"></button>
      </form>
    </section>

    <section class="conn">
      <h3 data-i18n="goalTitle"></h3>
      <p data-i18n="goalNote"></p>
      <div class="add-row">
        <input id="goal-hours" class="narrow" type="number" min="0" max="16" step="0.5">
        <span data-i18n="hoursPerDay"></span>
      </div>
      <label class="switch-row flush">
        <span data-i18n="notifications"></span>
        <input type="checkbox" id="notifications"><span class="switch"></span>
      </label>
      <label class="switch-row flush">
        <span data-i18n="assistantFocus"></span>
        <input type="checkbox" id="assistant-focus"><span class="switch"></span>
      </label>
    </section>

    <p class="conn-note" data-i18n="extensionNote"></p>
    <p class="conn-error" id="focus-error" hidden></p>
  </dialog>

  <dialog id="clients-dialog" aria-labelledby="clients-dialog-title">
    <div class="dialog-head">
      <div>
        <h2 id="clients-dialog-title" data-i18n="clientsDialogTitle"></h2>
        <p data-i18n="clientsDialogLead"></p>
      </div>
      <button class="icon-btn" id="clients-close" data-i18n-title="close">
        <svg viewBox="0 0 16 16" width="16" height="16"><path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="client-suggestions"></div>
    <div id="client-editors"></div>
    <div class="add-row">
      <button class="primary-btn" id="client-add" data-i18n="clientAdd"></button>
    </div>
    <p class="conn-note" data-i18n="clientsPrivacy"></p>
    <p class="conn-error" id="clients-error" hidden></p>
  </dialog>

  <div class="menu cat-menu" id="cat-menu" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <div class="tooltip" id="tooltip" hidden></div>

  <script src="mock.js"></script>
  <script src="app.js"></script>
</body>
</html>
