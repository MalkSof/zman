<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zman</title>
  <style>
    :root { color-scheme: light dark; --page: #f6f6f3; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #7a7872; --line: rgba(11,11,11,.1); --accent: #2a78d6; --track: #cde2fb; }
    @media (prefers-color-scheme: dark) { :root { --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #96948d; --line: rgba(255,255,255,.11); --accent: #3987e5; --track: #123a6b; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--page); color: var(--ink); font: 16px/1.55 system-ui, "Segoe UI", sans-serif; }
    main { width: min(480px, 100%); padding: 40px 36px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
    .ring { width: 76px; height: 76px; margin: 0 auto 22px; }
    .ring circle { fill: none; stroke-width: 6; }
    .ring .track { stroke: var(--track); }
    .ring .arc { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 1s linear; }
    h1 { margin: 0; font-size: 25px; font-weight: 680; letter-spacing: -0.02em; text-wrap: balance; }
    #site { color: var(--accent); }
    p { margin: 12px 0 0; color: var(--ink-2); text-wrap: pretty; }
    #countdown { margin-top: 22px; font-size: 34px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    button { margin-top: 26px; padding: 10px 20px; border: 1px solid var(--line); border-radius: 11px; background: none; color: var(--ink-2); font: inherit; cursor: pointer; }
    button:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 5%, transparent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    footer { margin-top: 26px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg class="ring" viewBox="0 0 76 76" aria-hidden="true">
      <circle class="track" cx="38" cy="38" r="33"/>
      <circle class="arc" id="arc" cx="38" cy="38" r="33" stroke-dasharray="207.35" stroke-dashoffset="52"/>
    </svg>
    <h1 id="title"></h1>
    <p id="text"></p>
    <div id="countdown" hidden></div>
    <button id="retry"></button>
    <footer id="footer"></footer>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
