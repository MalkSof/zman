[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/cli", "crates/mcp", "crates/desktop", "crates/server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MalkSof/zman"

[workspace.dependencies]
zman-core = { path = "crates/core" }
zman-daemon = { path = "crates/daemon" }
zman-mcp = { path = "crates/mcp" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ulid = "3"
directories = "6"
sys-locale = "0.3"
jiff = "1"
