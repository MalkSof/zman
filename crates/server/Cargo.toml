[package]
name = "zman-server"
description = "zman sync server and remote MCP endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zman-core.workspace = true
zman-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
ulid.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls"] }
argon2 = "0.6"
sha2 = "0.11"
getrandom = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
